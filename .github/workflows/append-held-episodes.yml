name: Append held managed Shorts
on:
  workflow_dispatch:
    inputs:
      execute:
        description: 'Append production_hold only after exact record review. False = dry run.'
        default: false
        required: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: managed-shorts-canonical-queue
  cancel-in-progress: false
jobs:
  append:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install gspread
      - name: Validate or append held records
        env:
          HELD_EPISODES_JSON: ${{ secrets.HELD_EPISODES_JSON }}
          EXECUTE_HELD_APPEND: ${{ inputs.execute }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python scripts/append_held_episodes.py
