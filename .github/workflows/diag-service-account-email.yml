name: Diagnostic - service account identity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print client_email only
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 - <<'PY'
          import base64, json, os
          raw = os.environ.get("GOOGLE_SERVICE_ACCOUNT_JSON", "")
          if not raw.strip():
              raise SystemExit("secret is empty or unset")
          try:
              data = json.loads(raw)
          except ValueError:
              data = json.loads(base64.b64decode(raw))
          print("client_email:", data.get("client_email", "<missing>"))
          PY
