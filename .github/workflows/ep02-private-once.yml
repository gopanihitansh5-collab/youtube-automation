name: EP02 private corrected upload once
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-upload:
    if: github.repository == 'gopanihitansh5-collab/youtube-automation' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATASET_URL: ${{ secrets.EP02_DATASET_SIGNED_URL }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install upload dependencies
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth-oauthlib
      - name: Download, verify, private upload
        run: python scripts/ep02_private_upload.py
