on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upload-only:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install upload dependencies
        run: pip install google-api-python-client google-auth
      - name: Fetch approved video chunks and verify whole-file hash
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          for spec in '1MlrcwD2B9G64G_ZGbd-2JBm4tm0Oxt3Y 00' '1lZ9prix97TkSX1cbpQ4m764ebWfYQnHt 01' '1oo0yGct1anoko6ociXXvwfEngs9AuB-4 02'; do
            read -r id num <<< "$spec"
            curl --fail --location --silent --show-error --retry 3 --output "output/part-$num" "https://drive.google.com/uc?export=download&id=$id"
          done
          test "$(stat -c %s output/part-00)" -eq 20000000
          test "$(stat -c %s output/part-01)" -eq 20000000
          test "$(stat -c %s output/part-02)" -eq 5545443
          cat output/part-00 output/part-01 output/part-02 > output/final.mp4
          echo '44e5d4ffbd5b41dce749b67b2ddf7063fcc60b539768b679c0db857921915d50  output/final.mp4' | sha256sum -c -
          echo 'Verified OpenAI master hash and size'
      - name: Upload to the verified Alpha Explorer channel
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          if not all(os.getenv(k) for k in ('YT_CLIENT_ID','YT_CLIENT_SECRET','YT_REFRESH_TOKEN')):
              raise RuntimeError('YouTube OAuth secrets unavailable')
          creds=Credentials(None,refresh_token=os.environ['YT_REFRESH_TOKEN'],client_id=os.environ['YT_CLIENT_ID'],client_secret=os.environ['YT_CLIENT_SECRET'],token_uri='https://oauth2.googleapis.com/token',scopes=['https://www.googleapis.com/auth/youtube.upload'])
          svc=build('youtube','v3',credentials=creds)
          expected_channel_id='UCslmke9cOovN4gBowddLKiA'
          print('Expected Studio channel ID for post-upload verification:',expected_channel_id,flush=True)
          body={'snippet':{'title':"How an OpenAI Agent Reached Outside Its Sandbox (And Why the Alert Didn't Stop It)", 'description':'An OpenAI research agent reached one public chatbot through a narrow DNS gap. Editorial upload pending final Studio metadata and publication review. Source: https://alignment.openai.com/misalignment-reports/an-agent-used-dns-to-reach-an-external-chatbot', 'categoryId':'28'},'status':{'privacyStatus':'private','selfDeclaredMadeForKids':False}}
          media=MediaFileUpload('output/final.mp4',mimetype='video/mp4',chunksize=8*1024*1024,resumable=True)
          req=svc.videos().insert(part='snippet,status',body=body,media_body=media)
          response=None
          while response is None:
              progress,response=req.next_chunk()
              if progress: print('Upload progress',int(progress.progress()*100),'%',flush=True)
          if not response or not response.get('id'):raise RuntimeError('YouTube returned no video ID')
          print('UPLOAD_RESULT video_id='+response['id']+' url=https://youtu.be/'+response['id'],flush=True)
          PY
