name: Publish exact reviewed bank
on:
  workflow_dispatch:
    inputs:
      episode:
        type: choice
        required: true
        options:
          - dark-matter-corrected
          - passkeys-oct4
          - ai-sandbox-private
permissions:
  contents: write
concurrency:
  group: youtube-upload
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install requests cryptography google-api-python-client google-auth google-auth-oauthlib yt-dlp
      - name: Exact reviewed artifact, channel dedup and durable upload
        env:
          PYTHONPATH: .
          BANK_EPISODE: ${{ inputs.episode }}
          REVIEWED_DARK_MATTER_URL: ${{ secrets.REVIEWED_DARK_MATTER_URL }}
          REVIEWED_PASSKEYS_URL: ${{ secrets.REVIEWED_PASSKEYS_URL }}
          REVIEWED_AI_SANDBOX_URL: ${{ secrets.REVIEWED_AI_SANDBOX_URL }}
          UPLOAD_LEDGER_KEY: ${{ secrets.UPLOAD_LEDGER_KEY }}
          UPLOAD_LEDGER_GITHUB_TOKEN: ${{ github.token }}
          UPLOAD_LEDGER_REPO: ${{ github.repository }}
          UPLOAD_LEDGER_BRANCH: private-upload-state
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python scripts/publish_reviewed_bank.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-publication-result
          path: output_reviewed/result.json
          if-no-files-found: ignore
