name: Read-only bound Sheet inventory
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install gspread
      - name: Inspect bound Sheet without writes
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/probe_bound_sheet_inventory.py
      - name: Preserve private Sheet snapshot
        uses: actions/upload-artifact@v4
        with:
          name: private-bound-sheet-snapshot
          path: private_sheet_snapshot/
          if-no-files-found: error
          retention-days: 7
