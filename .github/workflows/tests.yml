name: Pipeline tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install requests Pillow google-auth google-auth-oauthlib google-api-python-client cryptography gspread
      - run: python -m unittest discover -s tests
        env:
          EDITOR_INTEGRATION: "1"
          FFMPEG_INTEGRATION: "1"
