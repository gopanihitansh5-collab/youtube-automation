name: yt-oauth-exchange
on:
  workflow_dispatch:
    inputs:
      code:
        description: one-time auth code
        required: true
      redirect_uri:
        description: redirect uri used for consent
        required: true
jobs:
  exchange:
    runs-on: ubuntu-latest
    steps:
      - name: Exchange code and store credentials
        env:
          CID: ${{ secrets.TMP_NEW_CID }}
          CSEC: ${{ secrets.TMP_NEW_CSEC }}
          GHT: ${{ secrets.TMP_GH_PAT }}
          CODE: ${{ inputs.code }}
          RURI: ${{ inputs.redirect_uri }}
          REPO: ${{ github.repository }}
        run: |
          pip install -q pynacl
          echo "::add-mask::$CSEC"
          code=$(curl -s -o /tmp/r.json -w '%{http_code}' https://oauth2.googleapis.com/token \
            --data-urlencode "client_id=$CID" --data-urlencode "client_secret=$CSEC" \
            --data-urlencode "code=$CODE" --data-urlencode "redirect_uri=$RURI" --data-urlencode grant_type=authorization_code)
          echo "http_status=$code"
          echo "google_error=$(jq -r '.error // "none"' /tmp/r.json)"
          echo "granted_scope=$(jq -r '.scope // "none"' /tmp/r.json)"
          RT=$(jq -r '.refresh_token // empty' /tmp/r.json)
          if [ -z "$RT" ]; then echo "refresh_token=absent"; rm -f /tmp/r.json; exit 1; fi
          echo "::add-mask::$RT"
          echo "refresh_token=present"
          python3 - "$REPO" "$GHT" <<'PY'
          import sys, os, json, base64, urllib.request
          from nacl import public, encoding
          repo, tok = sys.argv[1], sys.argv[2]
          rt = json.load(open("/tmp/r.json"))["refresh_token"]
          def call(m, p, b=None):
              r = urllib.request.Request("https://api.github.com/repos/%s/%s" % (repo, p), method=m,
                  data=json.dumps(b).encode() if b else None,
                  headers={"Authorization": "Bearer " + tok, "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(r) as f:
                  return f.status, json.loads(f.read() or b"null")
          _, k = call("GET", "actions/secrets/public-key")
          pk = public.PublicKey(k["key"].encode(), encoding.Base64Encoder())
          def put(name, val):
              enc = base64.b64encode(public.SealedBox(pk).encrypt(val.encode())).decode()
              s, _ = call("PUT", "actions/secrets/" + name, {"encrypted_value": enc, "key_id": k["key_id"]})
              print(name, "put status", s)
          put("YT_REFRESH_TOKEN", rt)
          put("YT_CLIENT_ID", os.environ["CID"])
          put("YT_CLIENT_SECRET", os.environ["CSEC"])
          vk = public.PublicKey("k3bo3ZdGu1Fo4YdNPp9SW5FA5vFUcPl3ucPTb24xUUo=".encode(), encoding.Base64Encoder())
          print("sealed_for_vault=" + base64.b64encode(public.SealedBox(vk).encrypt(rt.encode())).decode())
          PY
          rm -f /tmp/r.json
