name: yt-oauth-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe token endpoint
        env:
          CID: ${{ secrets.YT_CLIENT_ID }}
          CSEC: ${{ secrets.YT_CLIENT_SECRET }}
          RTOK: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          code=$(curl -s -o /tmp/r.json -w '%{http_code}' https://oauth2.googleapis.com/token \
            --data-urlencode "client_id=$CID" --data-urlencode "client_secret=$CSEC" \
            --data-urlencode "refresh_token=$RTOK" --data-urlencode grant_type=refresh_token)
          echo "http_status=$code"
          echo "google_error=$(jq -r '.error // "none"' /tmp/r.json)"
          echo "scope=$(jq -r '.scope // "none"' /tmp/r.json)"
          echo "cid_prefix=${CID:0:12}"
